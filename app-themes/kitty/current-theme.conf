# Dracula — tema oficial para kitty
# Fonte: https://github.com/dracula/kitty
# Paleta canônica: https://draculatheme.com
#
# Carregado por kitty.conf via `include current-theme.conf`.
# As cores base coincidem com kitty.conf.original (mantidas em sincronia).

foreground            #f8f8f2
background            #282a36
selection_foreground  #ffffff
selection_background  #44475a

url_color #8be9fd

# Cursor
cursor            #f8f8f2
cursor_text_color #282a36

# Bordas de janela
active_border_color   #bd93f9
inactive_border_color #6272a4
bell_border_color     #ff5555

# Barra de abas
active_tab_foreground    #282a36
active_tab_background    #f8f8f2
active_tab_font_style    bold
inactive_tab_foreground  #f8f8f2
inactive_tab_background  #6272a4
inactive_tab_font_style  normal

# Marcas (marks)
mark1_foreground #282a36
mark1_background #ff79c6
mark2_foreground #282a36
mark2_background #50fa7b
mark3_foreground #282a36
mark3_background #bd93f9

# Preto
color0  #21222c
color8  #6272a4

# Vermelho
color1  #ff5555
color9  #ff6e6e

# Verde
color2  #50fa7b
color10 #69ff94

# Amarelo
color3  #f1fa8c
color11 #ffffa5

# Azul
color4  #bd93f9
color12 #d6acff

# Magenta
color5  #ff79c6
color13 #ff92df

# Ciano
color6  #8be9fd
color14 #a4ffff

# Branco
color7  #f8f8f2
color15 #ffffff
